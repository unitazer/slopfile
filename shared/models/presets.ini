# llama.cpp router-mode model presets.
#
# Each `[name]` section advertises one model; llama-server routes incoming
# `/v1/chat/completions` (and `/models/load`) requests to the matching model
# by the request's `model` field. Drop a GGUF (and optional mmproj) into
# /shared/models (i.e. this directory) and add a section to host it.
#
# Key format is the long llama-server flag name without leading dashes.
# Per-model inference args (ctx, ngl, spec, kv-cache) belong in the section.

[qwen3.8-27b]
model = /models/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = /models/mmproj-BF16.gguf
load-on-startup = true
ctx-size = 65536
flash-attn = true
threads = 12
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 3
