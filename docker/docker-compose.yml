services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: clanker-llama
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [all]
    ulimits:
      memlock: -1
    volumes:
      - ../shared/models:/models:ro
    command: [
      "--models-preset", "/models/presets.ini",
      "--models-max", "2",
      "--mlock",
      "--no-mmap",
      "--host", "0.0.0.0",
      "--port", "8080"
    ]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  slopfile:
    build:
      context: ..
      dockerfile: docker/Dockerfile.slopfile
    container_name: clanker-slopfile
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-998}"
    volumes:
      - ../workspace:/workspace
      - ../shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      llama-server:
        condition: service_healthy
    environment:
      SLOPFILE_CONFIG: /shared/slopfile.toml
      SLOPFILE_API_BASE: http://llama-server:8080
      SLOPFILE_TRANSCRIPTS: /shared/transcripts
      SLOPFILE_SKILLS_DIR: /shared/skills
      SLOPFILE_WORKDIR: /workspace
      RUST_LOG: slopfile=info,warn
    restart: unless-stopped
