services:
  llama-server:
    # CPU build. Swap to :server-cuda (plus the nvidia device reservation) if a
    # GPU goes back in.
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: clanker-llama
    ulimits:
      memlock: -1
    volumes:
      - ../shared/models:/models:ro
    command: [
      "--models-preset", "/models/presets.ini",
      "--models-max", "2",
      #"--mlock",
      #"--no-mmap",
      "--host", "0.0.0.0",
      "--port", "8080"
    ]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  slopfile:
    build:
      context: ..
      dockerfile: docker/Dockerfile.slopfile
    container_name: clanker-slopfile
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-998}"
    volumes:
      - ../workspace:/workspace
      - ../shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      llama-server:
        condition: service_healthy
    environment:
      SLOPFILE_CONFIG: /shared/slopfile.toml
      SLOPFILE_API_BASE: http://llama-server:8080
      SLOPFILE_TRANSCRIPTS: /shared/transcripts
      SLOPFILE_SKILLS_DIR: /shared/skills
      SLOPFILE_WORKDIR: /workspace
      SF_ADDR: 0.0.0.0:8787
      RUST_LOG: slopfile=info,warn
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # `${...:?}` makes a missing key an error at `docker compose up` rather than an empty
      # string in the container, which would otherwise reach the model host as
      # `Authorization: Bearer ` and come back as a 401 that looks like a wrong key.
      #
      # The lazier alternative needs no compose change at all: put the header in the session
      # transcript's ```toml fence instead. Transcripts are gitignored and are not part of any
      # request -- though the model can read its own file, so that is convenience, not secrecy.
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
